<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>易瑋鈴 Weiling Yi｜JPC connectivity</title>
<style>
:root{
  color-scheme:light;
  --brand:#db1d18; --brand-ink:#fff;
  --bg:#ebebed; --card:#fff; --text:#1d1d1f; --muted:#7a7a80; --line:#ececee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  display:flex;justify-content:center;padding:24px 16px 36px}
.card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:40px 28px 28px;
  box-shadow:0 4px 20px rgba(0,0,0,.06)}
.logo{display:block;width:160px;max-width:60%;height:auto;margin:0 auto}
.id{text-align:center;margin-top:36px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.1em;text-indent:.1em}
.en{margin:6px 0 0;color:var(--muted);font-size:15px;letter-spacing:.06em}
.role{margin:14px 0 0;font-size:14px;color:var(--brand);letter-spacing:.04em}
.bar{width:32px;height:3px;border-radius:2px;background:var(--brand);margin:22px auto 0}
.links{margin-top:14px}
.row{display:flex;align-items:baseline;gap:14px;padding:15px 2px;text-decoration:none;color:inherit;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{flex:0 0 48px;font-size:12.5px;color:var(--muted)}
.val{flex:1;font-size:15.5px;word-break:break-all}
.qr{margin-top:14px;text-align:center}
#qrbox{display:inline-block;line-height:0}
#qrbox img,#qrbox canvas{display:block;width:150px;height:150px}
.btn{display:block;width:100%;margin-top:26px;padding:15px 8px;border:0;border-radius:14px;background:var(--brand);
  color:var(--brand-ink);font:inherit;font-size:16px;font-weight:600;letter-spacing:.08em;cursor:pointer}
</style>
</head>
